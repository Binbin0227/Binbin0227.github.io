<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ice Queen - 3D Gesture Particle System</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Arial', sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* UI 界面 */
        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none; /* 让鼠标事件穿透到 Canvas，除非点按钮 */
        }
        
        .model-btn {
            background: rgba(0, 20, 40, 0.6);
            border: 1px solid rgba(100, 200, 255, 0.3);
            color: #aaddff;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            pointer-events: auto;
            backdrop-filter: blur(5px);
            transition: all 0.3s;
            text-shadow: 0 0 5px #00ffff;
            font-weight: bold;
            text-align: left;
        }

        .model-btn:hover, .model-btn.active {
            background: rgba(0, 50, 100, 0.8);
            border-color: #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
            transform: translateX(5px);
        }

        /* 摄像头画面（默认隐藏，调试可开启） */
        #video-input {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 160px;
            height: 120px;
            border-radius: 8px;
            opacity: 0.5;
            transform: scaleX(-1); /* 镜像 */
            z-index: 2;
            display: none; 
        }

        /* 加载遮罩 */
        #loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #020b16;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
        }
        
        #start-btn {
            margin-top: 20px;
            padding: 15px 40px;
            font-size: 1.2rem;
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            border: none;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 198, 255, 0.6);
            display: none;
        }

        .status-text {
            margin-top: 10px;
            color: #88ccff;
            font-size: 0.9rem;
        }

        .instruction {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            color: rgba(255,255,255,0.6);
            z-index: 5;
            pointer-events: none;
            font-size: 14px;
            text-shadow: 0 0 5px black;
        }
    </style>
</head>
<body>

    <video id="video-input" playsinline></video>

    <div id="ui-panel">
        <button class="model-btn active" onclick="switchModel('tree')">🎄 圣诞树 (Christmas Tree)</button>
        <button class="model-btn" onclick="switchModel('santa')">🎅 圣诞老人 (Santa)</button>
        <button class="model-btn" onclick="switchModel('snowflake')">❄️ 巨型雪花 (Snowflake)</button>
        <button class="model-btn" onclick="switchModel('stocking')">🧦 圣诞袜 (Stocking)</button>
        <button class="model-btn" onclick="switchModel('bell')">🔔 圣诞铃铛 (Bell)</button>
    </div>

    <div class="instruction">
        🖐️ 张开手掌：散开雪花 &nbsp;&nbsp;|&nbsp;&nbsp; ✊ 握紧拳头：凝结模型
    </div>

    <div id="loader">
        <h2>❄️ 初始化冰雪魔法引擎...</h2>
        <div class="status-text" id="status">正在加载视觉模型...</div>
        <button id="start-btn">开始魔法</button>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <script>
        // ================= 配置参数 =================
        const PARTICLE_COUNT = 4000; // 粒子总数 (根据性能调整)
        const PARTICLE_SIZE = 0.35;
        const DISPERSE_RANGE = 40;   // 散开范围
        const LERP_SPEED = 0.08;     // 粒子聚合速度
        const BREATH_SPEED = 0.002;  // 呼吸动画速度
        
        // 全局变量
        let scene, camera, renderer, composer;
        let particlesMesh, dummy;
        let clock = new THREE.Clock();
        
        // 粒子状态数据
        const particleData = []; // { current: Vector3, target: Vector3, velocity: Vector3 }
        const currentModelPoints = []; // 当前激活模型的点集
        
        // 手势状态
        let isFist = false;
        let handPosition = new THREE.Vector3(0, 0, 0);
        let handDetected = false;

        // 状态机
        let currentShapeName = 'tree';

        // ================= 1. 初始化 Three.js 场景 =================
        function initThree() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000510, 0.02);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 35;
            camera.position.y = 5;

            renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ReinhardToneMapping;
            container.appendChild(renderer.domElement);

            // 后处理 (Bloom Glow)
            const renderScene = new THREE.RenderPass(scene, camera);
            const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
            bloomPass.threshold = 0.1;
            bloomPass.strength = 1.2; // 辉光强度
            bloomPass.radius = 0.5;

            composer = new THREE.EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            // 灯光
            const ambientLight = new THREE.AmbientLight(0x404040);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(10, 10, 10);
            scene.add(dirLight);

            // 创建粒子系统
            createParticles();

            // 初始生成模型数据
            generateModelPoints(currentShapeName);

            // 监听窗口大小
            window.addEventListener('resize', onWindowResize, false);
        }

        // ================= 2. 粒子系统 (InstancedMesh) =================
        function createParticles() {
            // 几何体：六边形晶体 (Cylinder with 6 segments)
            const geometry = new THREE.CylinderGeometry(0.5, 0.5, 0.1, 6);
            geometry.rotateX(Math.PI / 2); // 扁平对着相机

            // 材质：发光材质
            const material = new THREE.MeshStandardMaterial({
                color: 0xaaddff,
                emissive: 0x0044aa,
                emissiveIntensity: 0.5,
                roughness: 0.1,
                metalness: 0.8,
                transparent: true,
                opacity: 0.9,
                side: THREE.DoubleSide
            });

            particlesMesh = new THREE.InstancedMesh(geometry, material, PARTICLE_COUNT);
            particlesMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
            scene.add(particlesMesh);

            dummy = new THREE.Object3D();

            // 初始化粒子数据
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                particleData.push({
                    current: new THREE.Vector3(
                        (Math.random() - 0.5) * DISPERSE_RANGE,
                        (Math.random() - 0.5) * DISPERSE_RANGE,
                        (Math.random() - 0.5) * DISPERSE_RANGE
                    ),
                    target: new THREE.Vector3(),
                    randomOffset: Math.random() * Math.PI * 2, // 用于呼吸动画相位
                    speedInfo: Math.random() * 0.5 + 0.5       // 差异化速度
                });
            }
        }

        // ================= 3. 圣诞模型程序化生成算法 =================
        // 返回归一化的点云数组
        function getShapePoints(shape) {
            const points = [];
            const count = PARTICLE_COUNT;

            if (shape === 'tree') {
                // 圣诞树：三个圆锥叠加 + 树干
                for (let i = 0; i < count; i++) {
                    const r = Math.random();
                    let p = new THREE.Vector3();
                    if (r < 0.1) { // 树干
                        p.set((Math.random()-0.5)*2, Math.random()*4 - 6, (Math.random()-0.5)*2);
                    } else if (r < 0.4) { // 底部大叶子
                        const h = Math.random() * 6; 
                        const rad = (6 - h) * 1.2 * Math.sqrt(Math.random());
                        const angle = Math.random() * Math.PI * 2;
                        p.set(Math.cos(angle)*rad, h - 4, Math.sin(angle)*rad);
                    } else if (r < 0.7) { // 中部
                        const h = Math.random() * 5;
                        const rad = (5 - h) * 1.0 * Math.sqrt(Math.random());
                        const angle = Math.random() * Math.PI * 2;
                        p.set(Math.cos(angle)*rad, h + 0, Math.sin(angle)*rad);
                    } else { // 顶部
                        const h = Math.random() * 4;
                        const rad = (4 - h) * 0.8 * Math.sqrt(Math.random());
                        const angle = Math.random() * Math.PI * 2;
                        p.set(Math.cos(angle)*rad, h + 3.5, Math.sin(angle)*rad);
                    }
                    points.push(p);
                }
            } 
            else if (shape === 'santa') {
                // 圣诞老人：简单的球体堆叠
                for (let i = 0; i < count; i++) {
                    const r = Math.random();
                    let p = new THREE.Vector3();
                    if (r < 0.4) { // 身体 (红色区域)
                        const phi = Math.acos(-1 + (2 * Math.random()));
                        const theta = Math.sqrt(Math.PI * PARTICLE_COUNT) * phi;
                        const rad = 4 * Math.random();
                        p.setFromSphericalCoords(rad, Math.acos((Math.random()*2)-1), Math.random()*Math.PI*2);
                        p.y -= 2; // 下移
                    } else if (r < 0.65) { // 头
                        const rad = 2.2 * Math.random(); // 实心球
                        p.setFromSphericalCoords(rad, Math.acos((Math.random()*2)-1), Math.random()*Math.PI*2);
                        p.y += 3.5;
                    } else if (r < 0.8) { // 胡子 (脸下半部)
                        const angle = Math.random() * Math.PI; // 前半圆
                        const rad = 2.3;
                        p.set(Math.cos(angle)*rad, Math.random()*2 + 2, Math.sin(angle)*rad + 1);
                    } else { // 帽子
                        const h = Math.random() * 4;
                        const rad = (4-h) * 0.6;
                        const angle = Math.random() * Math.PI * 2;
                        p.set(Math.cos(angle)*rad + 1, h + 5, Math.sin(angle)*rad); // 稍微歪一点
                        // 帽子尖球
                        if(Math.random() > 0.95) p.set(3, 7, 0); 
                    }
                    points.push(p);
                }
            }
            else if (shape === 'snowflake') {
                // 分形雪花：六向对称
                for (let i = 0; i < count; i++) {
                    // 生成单瓣的形状
                    let x = (Math.random() - 0.5) * 2;
                    let y = Math.random() * 10;
                    let z = (Math.random() - 0.5) * 0.5; // 薄片
                    
                    // 模拟分枝结构
                    if (Math.abs(x) > y * 0.2) x *= 0.1; // 修正为主干
                    if (Math.random() > 0.5) { // 侧枝
                        y = Math.random() * 8;
                        x = Math.random() * 4 * (Math.random() > 0.5 ? 1 : -1);
                        z = (Math.random() - 0.5) * 0.2;
                    }

                    // 旋转复制 6 次
                    const branch = Math.floor(Math.random() * 6);
                    const angle = (branch / 6) * Math.PI * 2;
                    
                    const p = new THREE.Vector3(x, y, z);
                    p.applyAxisAngle(new THREE.Vector3(0, 0, 1), angle);
                    points.push(p);
                }
            }
            else if (shape === 'stocking') {
                // 圣诞袜：贝塞尔曲线路径
                const curve = new THREE.CatmullRomCurve3([
                    new THREE.Vector3(0, 5, 0),
                    new THREE.Vector3(0, 0, 0),
                    new THREE.Vector3(2, -4, 0),
                    new THREE.Vector3(5, -4, 0) // 脚尖
                ]);
                
                for(let i=0; i<count; i++){
                    const t = Math.random();
                    const pt = curve.getPoint(t);
                    // 袜身厚度
                    let thickness = 2.5; 
                    if(t > 0.8) thickness = 2.0; // 脚尖细一点
                    
                    const angle = Math.random() * Math.PI * 2;
                    const r = Math.random() * thickness;
                    
                    // 在路径点周围随机分布
                    const offset = new THREE.Vector3(Math.cos(angle)*r, Math.sin(angle)*r, (Math.random()-0.5)*thickness);
                    // 简单旋转适应大概方向（简化处理）
                    if(t > 0.5) offset.applyAxisAngle(new THREE.Vector3(0,0,1), -Math.PI/4);
                    
                    points.push(pt.add(offset));
                }
            }
            else if (shape === 'bell') {
                // 铃铛
                for(let i=0; i<count; i++){
                    const h = Math.random() * 8 - 4; // -4 to 4
                    // 钟形曲线函数
                    const yNorm = (h + 4) / 8; // 0 to 1
                    // 顶部小，底部散开，顶部有个圆顶
                    let rBase = (1 - yNorm) * 4 + 1; // 线性变大
                    if(yNorm > 0.8) rBase = Math.sqrt(1 - (yNorm-0.8)*5) * 2; // 顶部圆弧
                    
                    const r = rBase * Math.sqrt(Math.random()); // 实心
                    const angle = Math.random() * Math.PI * 2;
                    
                    let p = new THREE.Vector3(Math.cos(angle)*r, h, Math.sin(angle)*r);
                    
                    // 铃舌
                    if(Math.random() < 0.15 && h < -3) {
                         p = new THREE.Vector3((Math.random()-0.5), -4.5 + Math.random(), (Math.random()-0.5));
                    }
                    points.push(p);
                }
            }

            return points;
        }

        function generateModelPoints(shapeName) {
            const rawPoints = getShapePoints(shapeName);
            // 清空并重新填充目标点
            currentModelPoints.length = 0; 
            for(let p of rawPoints) {
                currentModelPoints.push(p);
            }
        }

        function switchModel(name) {
            currentShapeName = name;
            generateModelPoints(name);
            
            // 更新 UI 状态
            document.querySelectorAll('.model-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        // ================= 4. MediaPipe 手势识别逻辑 =================
        function initMediaPipe() {
            const videoElement = document.getElementById('video-input');
            
            const hands = new Hands({locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
            }});

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            hands.onResults(onHandsResults);

            const cameraUtils = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({image: videoElement});
                },
                width: 320,
                height: 240
            });
            
            return cameraUtils;
        }

        function onHandsResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                handDetected = true;
                const landmarks = results.multiHandLandmarks[0];
                
                // 1. 获取手掌中心位置 (使用 0号点 手腕 和 9号点 中指根部 的中间)
                const wrist = landmarks[0];
                const middleFingerBase = landmarks[9];
                
                // 映射坐标: MediaPipe x/y 是 0-1, 且 y 轴向下。Three.js y 轴向上。
                // 另外摄像头是镜像的，x 需要反转
                const screenX = (1 - middleFingerBase.x) * 2 - 1; // -1 to 1
                const screenY = -(middleFingerBase.y * 2 - 1);    // -1 to 1
                
                // 映射到 3D 空间大概位置 (深度假设 Z=0)
                // 视口宽度大概是 30, 高度大概是 20 (基于相机 z=35)
                handPosition.set(screenX * 15, screenY * 10, 0);

                // 2. 识别手势：张开 vs 握拳
                // 算法：计算指尖到掌心的平均距离。如果距离很小，则是拳头。
                const palmCenter = { x: (wrist.x + middleFingerBase.x)/2, y: (wrist.y + middleFingerBase.y)/2 };
                const tips = [8, 12, 16, 20]; // 食指、中指、无名指、小指尖
                let totalDist = 0;
                
                tips.forEach(idx => {
                    const tip = landmarks[idx];
                    const d = Math.sqrt(Math.pow(tip.x - palmCenter.x, 2) + Math.pow(tip.y - palmCenter.y, 2));
                    totalDist += d;
                });
                
                const avgDist = totalDist / 4;
                // 阈值通常在 0.15 左右区分握拳和张开
                isFist = avgDist < 0.18; 

            } else {
                handDetected = false;
                isFist = false;
            }
        }

        // ================= 5. 动画主循环 =================
        function animate() {
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime();
            const delta = clock.getDelta();

            // 更新每个粒子
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const data = particleData[i];
                const dummyObj = dummy;

                // 逻辑核心：
                // 如果检测到手且握拳 -> 目标点 = 模型点 + 手的位置
                // 否则 -> 目标点 = 随机漂浮 (模拟下雪/散开)
                
                if (handDetected && isFist && currentModelPoints[i]) {
                    // 凝聚模式
                    const modelPt = currentModelPoints[i];
                    
                    // 加上呼吸效果
                    const breathScale = 1 + Math.sin(time * 2 + data.randomOffset) * 0.05;
                    
                    data.target.copy(modelPt).multiplyScalar(breathScale).add(handPosition);
                    
                    // 增加一点随机抖动，让它看起来像能量
                    data.target.x += (Math.random()-0.5) * 0.2;
                    data.target.y += (Math.random()-0.5) * 0.2;
                    data.target.z += (Math.random()-0.5) * 0.2;

                    // 插值移动
                    data.current.lerp(data.target, LERP_SPEED * data.speedInfo);

                } else {
                    // 散开模式 (冰雪女王飞散效果)
                    
                    // 定义一个基于噪声的流场，或者简单的重力+布朗运动
                    // 如果手张开，让粒子有个向外推的力，或者只是自然下落
                    
                    if (handDetected && !isFist) {
                         // 手掌张开，粒子受到排斥或飞舞
                         // 这里简化为：回到随机的大空间，并带有旋转
                         const angle = time * 0.2 + data.randomOffset;
                         const radius = 15 + Math.sin(time + i) * 5;
                         data.target.set(
                             Math.cos(angle) * radius,
                             Math.sin(time * 0.5 + i) * 10,
                             Math.sin(angle) * radius
                         );
                    } else {
                        // 无手势，自然飘落
                         data.target.y -= 0.05; 
                         if(data.current.y < -15) {
                             data.current.y = 15; // 复位到顶部
                             data.target.y = 14;
                         }
                         // 简单的水平游荡
                         data.target.x += Math.sin(time + i) * 0.02;
                         data.target.z += Math.cos(time + i) * 0.02;
                    }
                    
                    // 散开时 Lerp 慢一点，更飘逸
                    data.current.lerp(data.target, 0.02);
                }

                // 更新 Instance Matrix
                dummyObj.position.copy(data.current);
                
                // 粒子自转
                dummyObj.rotation.x = time + i;
                dummyObj.rotation.y = time * 0.5 + i;
                
                // 根据状态调整大小
                const scale = (handDetected && isFist) ? PARTICLE_SIZE : PARTICLE_SIZE * 0.6;
                dummyObj.scale.set(scale, scale, scale);

                dummyObj.updateMatrix();
                particlesMesh.setMatrixAt(i, dummyObj.matrix);
            }

            particlesMesh.instanceMatrix.needsUpdate = true;
            
            // 整体场景缓慢旋转（如果未交互）
            if(!handDetected) {
                scene.rotation.y = Math.sin(time * 0.1) * 0.2;
            } else {
                // 交互时稍微回正
                scene.rotation.y = THREE.MathUtils.lerp(scene.rotation.y, 0, 0.05);
            }

            composer.render();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        // ================= 6. 启动逻辑 =================
        const startBtn = document.getElementById('start-btn');
        const loader = document.getElementById('loader');
        const statusText = document.getElementById('status');

        // 预加载流程
        window.onload = () => {
            initThree();
            statusText.innerText = "正在初始化手势识别核心...";
            
            const cameraUtils = initMediaPipe();
            
            // 给 MediaPipe 一点时间加载，然后显示开始按钮
            setTimeout(() => {
                statusText.innerText = "准备就绪！";
                startBtn.style.display = 'block';
                
                startBtn.onclick = () => {
                    cameraUtils.start().then(() => {
                        loader.style.opacity = 0;
                        setTimeout(() => loader.remove(), 1000);
                        animate();
                    }).catch(err => {
                        alert("无法启动摄像头，请检查权限。");
                        console.error(err);
                    });
                };
            }, 1500);
        };

        // 辅助工具：导出切换函数给 HTML 调用
        window.switchModel = switchModel;

    </script>
</body>
