<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>豪华互动圣诞树 - R3F 调试版本</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #020804; } /* 确保 body 有颜色 */
    </style>
    
    <script src="https://unpkg.com/three@0.165.0/build/three.min.js"></script> 
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://unpkg.com/@react-three/fiber@8.20.0/dist/react-three-fiber.umd.js"></script>
    <script src="https://unpkg.com/@react-three/drei@9.108.3/dist/react-three-drei.umd.js"></script>
    <script src="https://unpkg.com/@react-three/postprocessing@2.16.2/dist/postprocessing.umd.js"></script>
    
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // --- 确保全局变量的访问 ---
        const { useState, useMemo, useRef, Suspense, useEffect } = React;
        const { Canvas, useFrame, useLoader } = R3F;
        const { Environment, OrbitControls, ContactShadows, Image, Html } = Drei;
        const { EffectComposer, Bloom, Vignette } = Postprocessing;
        
        console.log("R3F Libraries Loaded."); // 调试信息

        // --- 1. 数学工具与配置 (Math Utilities) ---
        const TREE_HEIGHT = 10;
        const TREE_RADIUS = 3.5;

        const getTreePosition = (yRatio, jitter = 0.5) => {
            const y = (yRatio - 0.5) * TREE_HEIGHT; 
            const radiusAtY = (1 - yRatio) * TREE_RADIUS;
            const angle = Math.random() * Math.PI * 2;
            const r = radiusAtY * Math.sqrt(Math.random()); 
            const x = r * Math.cos(angle);
            const z = r * Math.sin(angle);
            return new THREE.Vector3(x + (Math.random() - 0.5) * jitter, y, z + (Math.random() - 0.5) * jitter);
        };

        const getChaosPosition = (radius = 15) => {
            const v = new THREE.Vector3(
                Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5
            ).normalize().multiplyScalar(Math.random() * radius);
            return v;
        };

        // --- 2. 针叶系统 (Foliage) ---
        const particleCount = 15000;
        
        // 简化了着色器，确保没有语法错误影响 Babel 解析
        const vertexShader = `
            uniform float uTime;
            uniform float uMorphFactor; 
            attribute vec3 aTargetPos;
            attribute float aSize;
            varying vec3 vColor;
            
            void main() {
                float t = uMorphFactor;
                float ease = t * t * (3.0 - 2.0 * t);
                vec3 currentPos = mix(position, aTargetPos, ease);
                float wind = sin(uTime * 2.0 + currentPos.y * 0.5) * 0.1 * ease;
                currentPos.x += wind;
                
                vec4 mvPosition = modelViewMatrix * vec4(currentPos, 1.0);
                gl_Position = projectionMatrix * mvPosition;
                gl_PointSize = aSize * (300.0 / -mvPosition.z);
                
                vColor = mix(vec3(0.0, 0.2, 0.1), vec3(0.0, 0.26, 0.14), ease);
            }
        `;

        const fragmentShader = `
            varying vec3 vColor;
            void main() {
                float r = distance(gl_PointCoord, vec2(0.5));
                if (r > 0.5) discard;
                vec3 finalColor = mix(vColor, vec3(1.0, 0.8, 0.2), 1.0 - smoothstep(0.0, 0.1, r));
                gl_FragColor = vec4(finalColor, 1.0);
            }
        `;

        const Foliage = ({ isFormed }) => {
            const meshRef = useRef(null);
            
            const [positions, targetPositions, sizes] = useMemo(() => {
                const p = new Float32Array(particleCount * 3);
                const tp = new Float32Array(particleCount * 3);
                const s = new Float32Array(particleCount);
                for (let i = 0; i < particleCount; i++) {
                    const chaos = getChaosPosition(20);
                    const target = getTreePosition(Math.random(), 0.2); 
                    p.set([chaos.x, chaos.y, chaos.z], i * 3);
                    tp.set([target.x, target.y, target.z], i * 3);
                    s[i] = Math.random() * 0.15 + 0.05;
                }
                return [p, tp, s];
            }, []);

            const uniforms = useMemo(() => ({
                uTime: { value: 0 },
                uMorphFactor: { value: 0 }
            }), []);

            useFrame((state, delta) => {
                if (!meshRef.current) return;
                const material = meshRef.current.material;
                material.uniforms.uTime.value += delta;
                
                const targetMorph = isFormed ? 1 : 0;
                material.uniforms.uMorphFactor.value = THREE.MathUtils.lerp(
                    material.uniforms.uMorphFactor.value, 
                    targetMorph, 
                    delta * 2.5 
                );
            });

            return (
                <points ref={meshRef}>
                    <bufferGeometry>
                        <bufferAttribute attach="attributes-position" count={particleCount} array={positions} itemSize={3} />
                        <bufferAttribute attach="attributes-aTargetPos" count={particleCount} array={targetPositions} itemSize={3} />
                        <bufferAttribute attach="attributes-aSize" count={particleCount} array={sizes} itemSize={1} />
                    </bufferGeometry>
                    <shaderMaterial 
                        vertexShader={vertexShader} 
                        fragmentShader={fragmentShader} 
                        uniforms={uniforms}
                        transparent
                        depthWrite={false}
                    />
                </points>
            );
        }

        // --- 3. 装饰球 (InstancedMesh) ---

        const GoldOrnaments = ({ isFormed }) => {
            const count = 300;
            const meshRef = useRef(null);
            
            const data = useMemo(() => {
                return new Array(count).fill(0).map(() => ({
                    chaos: getChaosPosition(18),
                    target: getTreePosition(Math.random(), 0.8), 
                    scale: Math.random() * 0.3 + 0.1,
                    speed: Math.random() * 2 + 2 
                }));
            }, []);

            const tempObj = new THREE.Object3D();
            const currentPosition = useRef(data.map(d => d.chaos.clone()));
            
            useFrame((state, delta) => {
                if (!meshRef.current) return;
                
                data.forEach((item, i) => {
                    const lerpFactor = THREE.MathUtils.lerp(0.05, 0.15, item.speed / 4); 
                    const target = isFormed ? item.target : item.chaos;
                    
                    currentPosition.current[i].lerp(target, delta * lerpFactor * 10);
                    
                    const hover = isFormed ? Math.sin(state.clock.elapsedTime * item.speed + i) * 0.1 : 0;
                    
                    tempObj.position.copy(currentPosition.current[i]);
                    tempObj.position.y += hover;
                    tempObj.scale.setScalar(item.scale);
                    tempObj.updateMatrix();
                    meshRef.current.setMatrixAt(i, tempObj.matrix);
                });
                meshRef.current.instanceMatrix.needsUpdate = true;
            });

            return (
                <instancedMesh ref={meshRef} args={[null, null, count]}>
                    <sphereGeometry args={[1, 32, 32]} />
                    <meshStandardMaterial 
                        color="#FFD700" 
                        metalness={1} 
                        roughness={0.1} 
                        envMapIntensity={1.5} 
                        emissive="#FFD700"
                        emissiveIntensity={0.2}
                    />
                </instancedMesh>
            );
        }

        // --- 4. 照片挂件 (PhotoOrnaments) ---
        const PhotoFrame = ({ url, isFormed, index }) => {
            const groupRef = useRef(null);
            
            const { chaos, target } = useMemo(() => {
                const yRatio = 0.2 + Math.random() * 0.2; 
                const t = getTreePosition(yRatio, 0.1); 
                t.multiplyScalar(1.2); 
                return {
                    chaos: getChaosPosition(12),
                    target: t
                };
            }, []);
            
            useFrame((state, delta) => {
                if(!groupRef.current) return;
                
                const float = isFormed ? Math.sin(state.clock.elapsedTime * 1.5 + index) * 0.05 : 0; 
                const targetPos = new THREE.Vector3(target.x, target.y + float, target.z);
                
                const lerpFactor = delta * 2;
                groupRef.current.position.lerp(isFormed ? targetPos : chaos, lerpFactor);
                
                if (isFormed) {
                    groupRef.current.lookAt(0, target.y, 20); 
                } else {
                    groupRef.current.rotation.x += delta * 0.5;
                }
            });

            return (
                <group ref={groupRef}>
                    <mesh position={[0, 0, -0.05]}>
                        <boxGeometry args={[1.2, 1.5, 0.1]} />
                        <meshStandardMaterial 
                            color="#FFD700" 
                            metalness={1} 
                            roughness={0.1} 
                            emissive="#FFD700" 
                            emissiveIntensity={0.5} 
                        />
                    </mesh>
                    <Image url={url} scale={[1, 1.3]} />
                </group>
            );
        }

        // --- 5. 主应用 (App) ---
        const GrandLuxuryTree = () => {
            const [isFormed, setIsFormed] = useState(false);
            
            const photoUrls = useMemo(() => [
                'https://picsum.photos/300/400?random=1',
                'https://picsum.photos/300/400?random=2',
                'https://picsum.photos/300/400?random=3',
                'https://picsum.photos/300/400?random=4',
                'https://picsum.photos/300/400?random=5',
            ], []);

            return (
                <div className="w-full h-screen relative">
                    
                    {/* UI Overlay (Tailwind CSS) */}
                    <div className="absolute bottom-10 left-1/2 transform -translate-x-1/2 z-10 flex flex-col items-center gap-4">
                        <h1 className="text-[#FFD700] font-serif text-3xl tracking-widest uppercase drop-shadow-lg font-extrabold">
                            Grand Luxury Tree
                        </h1>
                        <button
                            onClick={() => setIsFormed(!isFormed)}
                            className="px-10 py-4 bg-gradient-to-r from-yellow-600 to-yellow-400 text-black font-bold text-lg rounded-full border-4 border-white/20 hover:scale-105 transition-all duration-300 shadow-[0_0_30px_rgba(255,215,0,0.8)]"
                        >
                            {isFormed ? "释放混沌 (CHAOS)" : "聚集成树 (FORMED)"}
                        </button>
                    </div>

                    <Canvas camera={{ position: [0, 4, 20], fov: 45 }} gl={{ antialias: true }}>
                        <color attach="background" args={['#020804']} /> 
                        
                        {/* 调试: 如果 3D 渲染失败，至少能看到这个红色的球 */}
                        <Suspense fallback={<mesh><sphereGeometry args={[1, 16, 16]} /><meshBasicMaterial color="red" /></mesh>}>
                            
                            {/* 3D 内容 */}
                            <ambientLight intensity={0.5} />
                            <spotLight 
                                position={[10, 20, 10]} 
                                angle={0.4} 
                                penumbra={1} 
                                intensity={5} 
                                color="#FFD700"
                            />
                            <Environment preset="lobby" />

                            <Foliage isFormed={isFormed} />
                            <GoldOrnaments isFormed={isFormed} />
                            
                            {photoUrls.map((url, i) => (
                                <PhotoFrame key={i} index={i} url={url} isFormed={isFormed} />
                            ))}
                            
                            <ContactShadows opacity={0.5} scale={30} blur={2} far={4} color="#000" />
                            
                            {/* 交互控制 */}
                            <OrbitControls 
                                enablePan={false} 
                                minPolarAngle={Math.PI / 4} 
                                maxPolarAngle={Math.PI / 2}
                                autoRotate={isFormed} 
                                autoRotateSpeed={0.3}
                                target={[0, 2, 0]}
                            />

                        </Suspense>

                        {/* 电影级后期处理 */}
                        <EffectComposer disableNormalPass>
                            <Bloom 
                                luminanceThreshold={0.8} 
                                mipmapBlur 
                                intensity={1.2} 
                                radius={0.8}
                            />
                            <Vignette eskil={false} offset={0.1} darkness={1.1} />
                        </EffectComposer>
                        
                    </Canvas>
                </div>
            );
        }

        // 渲染到 DOM
        ReactDOM.render(<GrandLuxuryTree />, document.getElementById('root'));
    </script>
</body>
</html>
