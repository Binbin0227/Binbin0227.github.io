<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>豪华互动圣诞树 - R3F 演示</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
    </style>
    
    <!-- React -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel 用于 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Three.js -->
    <script src="https://unpkg.com/three@0.165.0/build/three.min.js"></script>

    <!-- React Three Fiber / Drei / Postprocessing（UMD 版本） -->
    <script src="https://unpkg.com/@react-three/fiber@8.20.0/dist/react-three-fiber.umd.js"></script>
    <script src="https://unpkg.com/@react-three/drei@9.108.3/dist/drei.umd.js"></script>
    <script src="https://unpkg.com/@react-three/postprocessing@2.16.2/dist/postprocessing.umd.js"></script>
</head>

<body>
<div id="root"></div>

<script type="text/babel">

// 全局引用（关键修复）
const THREE = window.THREE;
const R3F = window.ReactThreeFiber;
const Drei = window.drei;
const Post = window.postprocessing;

const { Canvas, useFrame } = R3F;
const { useState, useMemo, useRef, Suspense } = React;
const { Environment, OrbitControls, ContactShadows, Image } = Drei;
const { EffectComposer, Bloom, Vignette } = Post;

/* ===========================================================
   1. 数学工具与配置
   =========================================================== */
const TREE_HEIGHT = 10;
const TREE_RADIUS = 3.5;

const getTreePosition = (yRatio, jitter = 0.5) => {
    const y = (yRatio - 0.5) * TREE_HEIGHT;
    const radiusAtY = (1 - yRatio) * TREE_RADIUS;

    const angle = Math.random() * Math.PI * 2;
    const r = radiusAtY * Math.sqrt(Math.random());

    const x = r * Math.cos(angle);
    const z = r * Math.sin(angle);

    return new THREE.Vector3(
        x + (Math.random() - 0.5) * jitter,
        y,
        z + (Math.random() - 0.5) * jitter
    );
};

const getChaosPosition = (radius = 15) => {
    return new THREE.Vector3(
        Math.random() - 0.5,
        Math.random() - 0.5,
        Math.random() - 0.5
    ).normalize().multiplyScalar(Math.random() * radius);
};

/* ===========================================================
   2. 针叶系统 Shader
   =========================================================== */

const particleCount = 15000;

const vertexShader = `
    uniform float uTime;
    uniform float uMorphFactor;
    attribute vec3 aTargetPos;
    attribute float aSize;
    varying vec3 vColor;

    void main() {
        float t = uMorphFactor;
        float ease = t * t * (3.0 - 2.0 * t);

        vec3 currentPos = mix(position, aTargetPos, ease);

        float wind = sin(uTime * 2.0 + currentPos.y * 0.5) * 0.1 * ease;
        currentPos.x += wind;

        vec4 mv = modelViewMatrix * vec4(currentPos, 1.0);
        gl_Position = projectionMatrix * mv;

        gl_PointSize = aSize * (300.0 / -mv.z);
        vColor = mix(vec3(0.0,0.2,0.1), vec3(0.0,0.26,0.14), ease);
    }
`;

const fragmentShader = `
    varying vec3 vColor;
    void main() {
        float r = distance(gl_PointCoord, vec2(0.5));
        if (r > 0.5) discard;
        vec3 finalColor = mix(vColor, vec3(1.0,0.8,0.2), 1.0 - smoothstep(0.0,0.1,r));
        gl_FragColor = vec4(finalColor, 1.0);
    }
`;

const Foliage = ({ isFormed }) => {
    const meshRef = useRef();

    const [positions, targets, sizes] = useMemo(() => {
        const p = new Float32Array(particleCount * 3);
        const t = new Float32Array(particleCount * 3);
        const s = new Float32Array(particleCount);

        for (let i = 0; i < particleCount; i++) {
            const chaos = getChaosPosition(20);
            const dest = getTreePosition(Math.random(), 0.2);

            p.set([chaos.x, chaos.y, chaos.z], i * 3);
            t.set([dest.x, dest.y, dest.z], i * 3);

            s[i] = Math.random() * 0.15 + 0.05;
        }
        return [p, t, s];
    }, []);

    const uniforms = useMemo(() => ({
        uTime: { value: 0 },
        uMorphFactor: { value: 0 }
    }), []);

    useFrame((state, delta) => {
        const mat = meshRef.current.material;
        mat.uniforms.uTime.value += delta;

        const target = isFormed ? 1 : 0;
        mat.uniforms.uMorphFactor.value = THREE.MathUtils.lerp(
            mat.uniforms.uMorphFactor.value,
            target,
            delta * 2.5
        );
    });

    return (
        <points ref={meshRef}>
            <bufferGeometry>
                <bufferAttribute
                    attachObject={['attributes', 'position']}
                    array={positions}
                    count={particleCount}
                    itemSize={3}
                />
                <bufferAttribute
                    attachObject={['attributes', 'aTargetPos']}
                    array={targets}
                    count={particleCount}
                    itemSize={3}
                />
                <bufferAttribute
                    attachObject={['attributes', 'aSize']}
                    array={sizes}
                    count={particleCount}
                    itemSize={1}
                />
            </bufferGeometry>

            <shaderMaterial
                vertexShader={vertexShader}
                fragmentShader={fragmentShader}
                uniforms={uniforms}
                transparent
                depthWrite={false}
            />
        </points>
    );
};

/* ===========================================================
   3. 金色装饰球 InstancedMesh
   =========================================================== */
const GoldOrnaments = ({ isFormed }) => {
    const count = 300;
    const ref = useRef();

    const data = useMemo(() =>
        new Array(count).fill(0).map(() => ({
            chaos: getChaosPosition(18),
            target: getTreePosition(Math.random(), 0.8),
            scale: Math.random() * 0.3 + 0.1,
            speed: Math.random() * 2 + 2
        }))
    , []);

    const temp = new THREE.Object3D();
    const current = useRef(data.map(d => d.chaos.clone()));

    useFrame((state, delta) => {
        data.forEach((d, i) => {
            const lerp = delta * (d.speed * 2.5);
            const dest = isFormed ? d.target : d.chaos;

            current.current[i].lerp(dest, lerp);

            temp.position.copy(current.current[i]);
            temp.scale.setScalar(d.scale);

            temp.updateMatrix();
            ref.current.setMatrixAt(i, temp.matrix);
        });

        ref.current.instanceMatrix.needsUpdate = true;
    });

    return (
        <instancedMesh ref={ref} args={[null, null, count]}>
            <sphereGeometry args={[1, 32, 32]} />
            <meshStandardMaterial
                color="#FFD700"
                metalness={1}
                roughness={0.1}
                emissive="#FFD700"
                emissiveIntensity={0.2}
            />
        </instancedMesh>
    );
};

/* ===========================================================
   4. 照片挂件
   =========================================================== */
const PhotoFrame = ({ url, index, isFormed }) => {
    const ref = useRef();

    const { chaos, target } = useMemo(() => {
        const yRatio = 0.2 + Math.random() * 0.2;
        const t = getTreePosition(yRatio, 0.1);
        t.multiplyScalar(1.2);

        return {
            chaos: getChaosPosition(12),
            target: t
        };
    }, []);

    useFrame((state, delta) => {
        const f = isFormed ? Math.sin(state.clock.elapsedTime * 1.5 + index) * 0.05 : 0;
        const dest = isFormed
            ? new THREE.Vector3(target.x, target.y + f, target.z)
            : chaos;

        ref.current.position.lerp(dest, delta * 2);

        if (isFormed) {
            ref.current.lookAt(0, target.y, 20);
        } else {
            ref.current.rotation.x += delta * 0.5;
        }
    });

    return (
        <group ref={ref}>
            <mesh position={[0, 0, -0.05]}>
                <boxGeometry args={[1.2, 1.5, 0.1]} />
                <meshStandardMaterial
                    color="#FFD700"
                    metalness={1}
                    roughness={0.1}
                    emissive="#FFD700"
                    emissiveIntensity={0.5}
                />
            </mesh>

            <Image url={url} scale={[1, 1.3]} />
        </group>
    );
};

/* ===========================================================
   5. 主应用
   =========================================================== */

const GrandLuxuryTree = () => {
    const [isFormed, setIsFormed] = useState(false);

    const photos = [
        "https://picsum.photos/300/400?random=1",
        "https://picsum.photos/300/400?random=2",
        "https://picsum.photos/300/400?random=3",
        "https://picsum.photos/300/400?random=4",
        "https://picsum.photos/300/400?random=5",
    ];

    return (
        <div className="w-full h-screen bg-black relative">

            {/* UI */}
            <div className="absolute bottom-10 left-1/2 -translate-x-1/2 z-10 text-center">
                <h1 className="text-[#FFD700] text-3xl drop-shadow-lg font-extrabold mb-4">
                    Grand Luxury Tree
                </h1>

                <button
                    onClick={() => setIsFormed(!isFormed)}
                    className="px-10 py-4 bg-gradient-to-r from-yellow-600 to-yellow-400 
                               rounded-full font-bold border-4 border-white/20 shadow-lg"
                >
                    {isFormed ? "释放混沌 (CHAOS)" : "聚集成树 (FORMED)"}
                </button>
            </div>

            <Canvas camera={{ position: [0, 4, 20], fov: 45 }}>
                <color attach="background" args={["#020804"]} />

                <ambientLight intensity={0.5} />
                <spotLight
                    position={[10, 20, 10]}
                    angle={0.4}
                    penumbra={1}
                    intensity={5}
                    color="#FFD700"
                />

                <Environment preset="lobby" />

                <Suspense fallback={null}>
                    <Foliage isFormed={isFormed} />
                    <GoldOrnaments isFormed={isFormed} />

                    {photos.map((url, i) => (
                        <PhotoFrame key={i} url={url} index={i} isFormed={isFormed} />
                    ))}

                    <ContactShadows opacity={0.5} scale={30} blur={2} />
                </Suspense>

                <OrbitControls
                    enablePan={false}
                    minPolarAngle={Math.PI / 4}
                    maxPolarAngle={Math.PI / 2}
                    autoRotate={isFormed}
                    autoRotateSpeed={0.3}
                    target={[0, 2, 0]}
                />

                <EffectComposer disableNormalPass>
                    <Bloom
                        luminanceThreshold={0.8}
                        mipmapBlur
                        intensity={1.2}
                        radius={0.8}
                    />
                    <Vignette eskil={false} offset={0.1} darkness={1.1} />
                </EffectComposer>
            </Canvas>
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<GrandLuxuryTree />);

</script>
</body>
</html>
