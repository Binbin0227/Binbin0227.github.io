<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Our Christmas Tree</title>
    <style>
        /* --- CSS 样式部分 --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #0f2027;
            background: -webkit-linear-gradient(to bottom, #2c5364, #203a43, #0f2027);
            background: linear-gradient(to bottom, #2c5364, #203a43, #0f2027);
            font-family: 'Georgia', 'Microsoft YaHei', serif;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* 加载遮罩 */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: #fff;
            transition: opacity 1s ease;
        }

        .loader-text {
            margin-top: 20px;
            font-size: 1.2rem;
            letter-spacing: 2px;
            animation: pulse 1.5s infinite;
        }

        /* 弹窗样式 */
        #modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        #modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            max-width: 90%;
            max-height: 80%;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            transform: scale(0.8);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        #modal.active .modal-content {
            transform: scale(1);
        }

        .modal-content img {
            max-width: 100%;
            max-height: 60vh;
            border-radius: 8px;
            border: 2px solid #ffcc00;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .quote-text {
            margin-top: 15px;
            font-size: 1.2rem;
            color: #d6336c;
            font-style: italic;
            line-height: 1.5;
        }

        .close-hint {
            margin-top: 10px;
            font-size: 0.8rem;
            color: #888;
        }

        /* 音乐控制 */
        #music-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 50;
            color: rgba(255,255,255,0.7);
            cursor: pointer;
            font-size: 0.9rem;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 5px 10px;
            border-radius: 20px;
            background: rgba(0,0,0,0.2);
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>

    <div id="loading">
        <div class="loader-text">正在编织浪漫回忆...</div>
    </div>

    <audio id="bgm" loop>
        <source src="https://music.163.com/song/media/outer/url?id=1901371647.mp3" type="audio/mpeg">
        您的浏览器不支持 audio 标签。
    </audio>
    <div id="music-control">♪ 播放音乐</div>

    <div id="canvas-container"></div>

    <div id="modal">
        <div class="modal-content">
            <img id="modal-img" src="" alt="Memory">
            <div class="quote-text" id="modal-quote"></div>
            <div class="close-hint">点击任意处关闭</div>
        </div>
    </div>

    <script src="https://unpkg.com/three@0.132.2/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.132.2/examples/js/controls/OrbitControls.js"></script>

    <script>
        /* --- JavaScript 逻辑部分 --- */

        // ==========================
        // 1. 用户自定义配置区域 (请修改这里)
        // ==========================
        
        // 替换成你的照片 URL 列表 (可以是本地路径或网络链接)
        // 为了演示，这里使用了 Unsplash 的随机图片
        const imgList = [
            'https://images.unsplash.com/photo-1518199266791-5375a83190b7?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=MnwzNjUyOXwwfDF8c2VhcmNofDF8fGNvdXBsZXxlbnwwfHx8fDE2NTk1MjQ1NTk&ixlib=rb-1.2.1&q=80&w=400',
            'https://images.unsplash.com/photo-1522075469751-3a6694fb2f61?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=MnwzNjUyOXwwfDF8c2VhcmNofDV8fGNvdXBsZXxlbnwwfHx8fDE2NTk1MjQ1NTk&ixlib=rb-1.2.1&q=80&w=400',
            'https://images.unsplash.com/photo-1494774157365-9e04c6720e47?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=MnwzNjUyOXwwfDF8c2VhcmNofDd8fGNvdXBsZXxlbnwwfHx8fDE2NTk1MjQ1NTk&ixlib=rb-1.2.1&q=80&w=400',
            'https://images.unsplash.com/photo-1529333166437-7750a6dd5a70?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=MnwzNjUyOXwwfDF8c2VhcmNofDh8fGNvdXBsZXxlbnwwfHx8fDE2NTk1MjQ1NTk&ixlib=rb-1.2.1&q=80&w=400',
            'https://images.unsplash.com/photo-1534351590666-13e3e96b5017?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=MnwzNjUyOXwwfDF8c2VhcmNofDEzfHxjb3VwbGV8ZW58MHx8fHwxNjU5NTI0NTU5&ixlib=rb-1.2.1&q=80&w=400',
            // ... 可以添加更多照片
        ];

        // 替换成你的专属情话
        const loveQuotes = [
            "所有的美好都与你有关。",
            "斯人若彩虹，遇上方知有。",
            "这一年，谢谢有你。",
            "我想和你一起看每一年的雪。",
            "愿得一人心，白首不相离。",
            "你是我最棒的圣诞礼物。",
            "Love you more than yesterday."
        ];

        // ==========================
        // 2. Three.js 初始化
        // ==========================

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        // 相机设置
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 35); // 初始视角

        // 渲染器设置
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true; // 开启阴影
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // 控制器
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; // 开启惯性
        controls.dampingFactor = 0.05;
        controls.enablePan = false; // 禁止平移
        controls.minDistance = 10;
        controls.maxDistance = 60;
        // 限制垂直旋转角度（防止看到树底穿帮，保持美感）
        controls.maxPolarAngle = Math.PI / 2 - 0.1; 
        controls.autoRotate = true; // 自动旋转
        controls.autoRotateSpeed = 1.0;

        // 灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        // 树内部的暖光 (模拟发光效果)
        const innerLight = new THREE.PointLight(0xffaa00, 1.5, 50);
        innerLight.position.set(0, 10, 0);
        scene.add(innerLight);

        // 顶部投射光 (产生阴影)
        const spotLight = new THREE.SpotLight(0xffffff, 1);
        spotLight.position.set(10, 40, 20);
        spotLight.castShadow = true;
        spotLight.shadow.mapSize.width = 1024;
        spotLight.shadow.mapSize.height = 1024;
        scene.add(spotLight);


        // ==========================
        // 3. 资源加载与树的生成
        // ==========================

        const textureLoader = new THREE.TextureLoader();
        const loadedTextures = [];
        let leavesMeshList = []; // 存储所有叶子Mesh以便射线检测

        // 加载管理器
        const loadingManager = new THREE.LoadingManager();
        loadingManager.onLoad = () => {
            const loadingScreen = document.getElementById('loading');
            loadingScreen.style.opacity = '0';
            setTimeout(() => loadingScreen.remove(), 1000);
            createTree(); // 资源加载完毕后造树
        };

        // 预加载所有纹理
        imgList.forEach(url => {
            const tex = textureLoader.load(url);
            tex.encoding = THREE.sRGBEncoding;
            loadedTextures.push(tex);
        });
        
        // 如果没有图片，放入一个空纹理防止报错，或者让管理器直接触发
        if(imgList.length === 0) {
            loadingManager.onLoad();
        } else {
            // 简单等待一小段时间确保 LoadingManager 捕获到状态 (ThreeJS 的 Loader 是异步的)
             // TextureLoader 内部关联了 DefaultLoadingManager，如果你用自定义manager需要传参
             // 这里为了简单，我们手动追踪加载数量或者简单使用延时并不是最佳实践，
             // 更稳妥的是给TextureLoader传manager
             // 下面重新修正逻辑:
        }

        // 使用自定义 Manager 重新加载一遍（或者你可以直接用 DefaultLoadingManager）
        // 这里为了代码清晰，我们采用 "生成树的时候直接用已有的 loadedTextures 数组"
        // 我们手动模拟一个加载等待，因为上面 TextureLoader 没有传入 manager
        let loadedCount = 0;
        if(imgList.length > 0){
             imgList.forEach((url, i) => {
                loadedTextures[i] = new THREE.TextureLoader(loadingManager).load(url);
             });
        } else {
            // 无图模式，生成颜色块
            loadingManager.onLoad();
        }


        function createTree() {
            const treeGroup = new THREE.Group();
            scene.add(treeGroup);

            // 树干
            const trunkGeo = new THREE.CylinderGeometry(0.5, 1.5, 5, 8);
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4d2926 });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 2.5;
            trunk.castShadow = true;
            trunk.receiveShadow = true;
            treeGroup.add(trunk);

            // 树叶参数
            const levels = 12; // 层数
            const startY = 5;  // 起始高度
            const heightStep = 1.8; // 层高间距
            const baseRadius = 1; // 顶部半径
            const radiusStep = 0.8; // 半径递增

            for (let i = 0; i < levels; i++) {
                const y = startY + (levels - 1 - i) * heightStep; // 从顶到底或从底到顶
                const currentY = startY + i * 1.5; // 实际高度位置
                // 我们让树呈现圆锥形：i=0是底部(大)，i=levels-1是顶部(小) ? 
                // 不，通常 i=0 底部比较好计算。
                // 让我们反过来：层数越高(i越大)，半径越小，高度越高。
                
                const levelHeight = startY + i * 1.8; // 高度
                const levelRadius = 7 - i * 0.5; // 半径逐渐变小
                if (levelRadius < 0.5) break; 

                // 每层的叶子数量
                const leafCount = Math.floor(levelRadius * 4 + 4); 

                for (let j = 0; j < leafCount; j++) {
                    const angle = (j / leafCount) * Math.PI * 2 + (i * 0.5); // 稍微错开每层角度
                    
                    // 叶子几何体 (照片载体)
                    const leafGeo = new THREE.PlaneGeometry(1.8, 2.2);
                    
                    // 获取纹理
                    let tex = null;
                    if(loadedTextures.length > 0) {
                        tex = loadedTextures[(i * leafCount + j) % loadedTextures.length];
                    }

                    const leafMat = new THREE.MeshStandardMaterial({
                        map: tex,
                        color: tex ? 0xffffff : 0x2d5a27, // 如果没图就显示绿色
                        side: THREE.DoubleSide,
                        transparent: true,
                        opacity: 0.95,
                    });

                    // 增加一点发光使得照片在暗处也可见
                    if(tex) {
                        leafMat.emissive = 0x222222; 
                        leafMat.emissiveMap = tex;
                    }

                    const leaf = new THREE.Mesh(leafGeo, leafMat);

                    // 位置计算
                    const x = Math.cos(angle) * levelRadius;
                    const z = Math.sin(angle) * levelRadius;

                    leaf.position.set(x, levelHeight, z);

                    // 朝向：让照片面向外部，稍微朝上
                    leaf.lookAt(0, levelHeight, 0); 
                    leaf.rotation.y += Math.PI; // 翻转过来，因为lookAt是背对圆心
                    leaf.rotation.x = -0.3; // 稍微倾斜，像松树叶子搭下来

                    leaf.castShadow = true;
                    
                    // 绑定数据用于点击事件
                    leaf.userData = {
                        isLeaf: true,
                        imgSrc: imgList[(i * leafCount + j) % imgList.length] || '',
                        quote: loveQuotes[Math.floor(Math.random() * loveQuotes.length)]
                    };

                    treeGroup.add(leaf);
                    leavesMeshList.push(leaf);
                }
            }

            // 树顶星星
            const starGeo = new THREE.OctahedronGeometry(1.5, 0);
            const starMat = new THREE.MeshStandardMaterial({ 
                color: 0xffea00, 
                emissive: 0xffea00,
                emissiveIntensity: 0.8,
                roughness: 0.2,
                metalness: 0.8
            });
            const star = new THREE.Mesh(starGeo, starMat);
            star.position.y = startY + levels * 1.8;
            
            // 星星旋转动画逻辑在 animate 中处理
            star.userData = { isStar: true };
            treeGroup.add(star);
            window.topStar = star; // 挂载到全局以便动画访问

            // 底部光晕 (Glow)
            const glowGeo = new THREE.PlaneGeometry(25, 25);
            // 简单的径向渐变纹理生成
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(64,64,0, 64,64,64);
            gradient.addColorStop(0, 'rgba(255, 200, 100, 0.4)');
            gradient.addColorStop(0.5, 'rgba(255, 200, 100, 0.1)');
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0,0,128,128);
            const glowTex = new THREE.CanvasTexture(canvas);
            
            const glowMat = new THREE.MeshBasicMaterial({ 
                map: glowTex, 
                transparent: true, 
                depthWrite: false,
                blending: THREE.AdditiveBlending,
                side: THREE.DoubleSide
            });
            const glowPlane = new THREE.Mesh(glowGeo, glowMat);
            glowPlane.rotation.x = -Math.PI / 2;
            glowPlane.position.y = 0.1;
            treeGroup.add(glowPlane);
        }

        // ==========================
        // 4. 雪花粒子系统
        // ==========================
        
        let snowSystem;
        function createSnow() {
            const particleCount = 600;
            const geometry = new THREE.BufferGeometry();
            const positions = [];
            const velocities = [];

            for (let i = 0; i < particleCount; i++) {
                positions.push(
                    Math.random() * 60 - 30, // x
                    Math.random() * 50,      // y
                    Math.random() * 60 - 30  // z
                );
                velocities.push(
                    (Math.random() - 0.5) * 0.05, // vx
                    Math.random() * 0.05 + 0.02,  // vy (下落速度)
                    (Math.random() - 0.5) * 0.05  // vz
                );
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            
            // 雪花材质
            // 用 Canvas 画一个小圆点作为纹理
            const canvas = document.createElement('canvas');
            canvas.width = 32; canvas.height = 32;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(16, 16, 10, 0, Math.PI * 2);
            ctx.fill();
            const snowTex = new THREE.CanvasTexture(canvas);

            const material = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 0.6,
                map: snowTex,
                transparent: true,
                opacity: 0.8,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });

            snowSystem = new THREE.Points(geometry, material);
            snowSystem.userData = { velocities: velocities };
            scene.add(snowSystem);
        }
        createSnow();

        // ==========================
        // 5. 交互逻辑 (点击与动画)
        // ==========================

        // 射线检测
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function onMouseClick(event) {
            // 计算鼠标位置 -1 到 +1
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            // 检测是否点击到了叶子
            const intersects = raycaster.intersectObjects(leavesMeshList);

            if (intersects.length > 0) {
                // 用户点击了照片，暂停自动旋转
                controls.autoRotate = false;
                
                const hitObj = intersects[0].object;
                if (hitObj.userData.isLeaf && hitObj.userData.imgSrc) {
                    showModal(hitObj.userData.imgSrc, hitObj.userData.quote);
                }
            } else {
                // 点击背景恢复自动旋转（可选）
                // controls.autoRotate = true; 
            }
        }

        // 绑定点击事件 (兼容移动端 touch)
        window.addEventListener('click', onMouseClick, false);
        window.addEventListener('touchend', (e) => {
            // 简单的 touch 处理，不处理滑动
            mouse.x = (e.changedTouches[0].clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.changedTouches[0].clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(leavesMeshList);
            if (intersects.length > 0) {
                controls.autoRotate = false;
                const hitObj = intersects[0].object;
                if (hitObj.userData.isLeaf) showModal(hitObj.userData.imgSrc, hitObj.userData.quote);
            }
        }, false);

        // 弹窗逻辑
        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modal-img');
        const modalQuote = document.getElementById('modal-quote');

        function showModal(src, quote) {
            modalImg.src = src;
            modalQuote.innerText = quote;
            modal.classList.add('active');
        }

        modal.addEventListener('click', () => {
            modal.classList.remove('active');
            // 关闭弹窗后恢复自动旋转
            setTimeout(() => { controls.autoRotate = true; }, 500);
        });

        // 音乐控制
        const bgm = document.getElementById('bgm');
        const musicBtn = document.getElementById('music-control');
        let isPlaying = false;

        musicBtn.addEventListener('click', () => {
            if (isPlaying) {
                bgm.pause();
                musicBtn.innerText = "♪ 播放音乐";
                musicBtn.style.opacity = 0.7;
            } else {
                bgm.play().then(() => {
                    musicBtn.innerText = "♪ 暂停音乐";
                    musicBtn.style.opacity = 1;
                }).catch(e => alert("请先与页面交互一下（随便点点）再播放音乐哦"));
            }
            isPlaying = !isPlaying;
        });

        // 窗口大小适配
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ==========================
        // 6. 动画主循环
        // ==========================

        function animate() {
            requestAnimationFrame(animate);

            controls.update(); // 必须调用，因为开启了 damping 和 autoRotate

            // 旋转顶部星星
            if (window.topStar) {
                window.topStar.rotation.y += 0.02;
                window.topStar.rotation.z = Math.sin(Date.now() * 0.002) * 0.2;
            }

            // 雪花下落
            if (snowSystem) {
                const positions = snowSystem.geometry.attributes.position.array;
                const velocities = snowSystem.userData.velocities;
                
                for (let i = 0; i < positions.length / 3; i++) {
                    // 更新 Y 轴
                    positions[i * 3 + 1] -= velocities[i * 3 + 1];
                    // 更新 X/Z 轴 (飘动)
                    positions[i * 3] += velocities[i * 3];
                    positions[i * 3 + 2] += velocities[i * 3 + 2];

                    // 循环重置：如果掉到底部
                    if (positions[i * 3 + 1] < 0) {
                        positions[i * 3 + 1] = 50;
                        positions[i * 3] = Math.random() * 60 - 30;
                        positions[i * 3 + 2] = Math.random() * 60 - 30;
                    }
                }
                snowSystem.geometry.attributes.position.needsUpdate = true;
            }

            renderer.render(scene, camera);
        }

        animate();

    </script>
</body>
</html>
